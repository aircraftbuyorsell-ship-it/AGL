name: AGL Execution Graph Validation

on:
  push:
    paths:
      - "schemas/agl-execution-graph.schema.json"
      - "examples/agl-execution-graph.example.json"
      - "test/agl-execution-graph-reconstruction.test.mjs"
      - "schemas/agl-measurement.schema.json"
      - "examples/agl-measurement.example.json"
      - "adapters/opentelemetry/**"
      - ".github/workflows/agl-execution-graph-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validator
        run: npm install --no-save ajv@8 ajv-formats@3
      - name: Validate execution graph schema
        run: |
          node <<'NODE'
          const fs = require("fs");
          const Ajv2020 = require("ajv/dist/2020");
          const addFormats = require("ajv-formats");

          const schema = JSON.parse(fs.readFileSync("schemas/agl-execution-graph.schema.json", "utf8"));
          const instance = JSON.parse(fs.readFileSync("examples/agl-execution-graph.example.json", "utf8"));

          const ajv = new Ajv2020({ allErrors: true, strict: true });
          addFormats(ajv);

          const validate = ajv.compile(schema);
          if (!validate(instance)) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }

          console.log("AGL Execution Graph JSON: VALID");
          console.log("execution_id:", instance.execution_id);
          console.log("nodes:", instance.nodes.length);
          console.log("edges:", instance.edges.length);
          console.log("evidence:", instance.evidence.length);
          NODE
      - name: Validate measurement schema
        run: |
          node <<'NODE'
          const fs = require("fs");
          const Ajv2020 = require("ajv/dist/2020");
          const addFormats = require("ajv-formats");

          const schema = JSON.parse(fs.readFileSync("schemas/agl-measurement.schema.json", "utf8"));
          const instance = JSON.parse(fs.readFileSync("examples/agl-measurement.example.json", "utf8"));

          const ajv = new Ajv2020({ allErrors: true, strict: true });
          addFormats(ajv);

          const validate = ajv.compile(schema);
          if (!validate(instance)) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }

          console.log("AGL Measurement JSON: VALID");
          console.log("measurement_id:", instance.measurement_id);
          console.log("processed_tokens:", instance.processing?.total_processed_tokens);
          console.log("normalized_quantity:", instance.processing?.normalized_quantity);
          NODE
      - name: Run reconstruction test
        run: node test/agl-execution-graph-reconstruction.test.mjs
      - name: Run OpenTelemetry adapter test
        run: node adapters/opentelemetry/test/otel-to-agl.test.mjs
